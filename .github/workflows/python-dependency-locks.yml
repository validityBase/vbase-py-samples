name: Python Dependency Locks

on:
  pull_request:
    paths:
      - "requirements/src/*.in"
      - "requirements/lock/*.txt"
      - "docs/requirements/src/*.in"
      - "docs/requirements/lock/*.txt"
      - "setup.py"
      - ".github/workflows/python-dependency-locks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-tooling:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # actions/checkout v5.0.1

      - name: Install lock tooling
        uses: validityBase/vbase-github-actions/.github/actions/setup-python-deps@v1
        with:
          requirements-files: |
            requirements/lock/tools.txt
          python-version: "3.11"
          require-hashes: "true"

      - name: Regenerate lock tooling lock
        run: pip-compile --strip-extras --no-annotate --allow-unsafe --generate-hashes -o requirements/lock/tools.txt requirements/src/tools.in

      - name: Verify lock tooling lock is committed
        run: git diff --exit-code -- requirements/lock/tools.txt

  root-locks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # actions/checkout v5.0.1

      - name: Install lock tooling
        uses: validityBase/vbase-github-actions/.github/actions/setup-python-deps@v1
        with:
          requirements-files: |
            requirements/lock/tools.txt
          python-version: "3.11"
          require-hashes: "true"

      - name: Regenerate root dependency locks
        run: |
          pip-compile --strip-extras --no-annotate --generate-hashes -o requirements/lock/base.txt requirements/src/base.in
          pip-compile --strip-extras --no-annotate --allow-unsafe --generate-hashes -o requirements/lock/dev.txt requirements/src/dev.in
          pip-compile --strip-extras --no-annotate --generate-hashes -o requirements/lock/win.txt requirements/src/win.in

      - name: Verify root dependency locks are committed
        run: git diff --exit-code -- requirements/lock/base.txt requirements/lock/dev.txt requirements/lock/win.txt

      - name: Install development dependencies
        uses: validityBase/vbase-github-actions/.github/actions/setup-python-deps@v1
        with:
          requirements-files: |
            requirements/lock/dev.txt
          python-version: "3.11"
          require-hashes: "true"

      - name: Install package metadata
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Check installed dependencies
        run: python -m pip check

  docs-locks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # actions/checkout v5.0.1

      - name: Install lock tooling
        uses: validityBase/vbase-github-actions/.github/actions/setup-python-deps@v1
        with:
          requirements-files: |
            requirements/lock/tools.txt
          python-version: "3.11"
          require-hashes: "true"

      - name: Regenerate docs dependency lock
        run: pip-compile --strip-extras --no-annotate --generate-hashes -o docs/requirements/lock/base.txt docs/requirements/src/base.in

      - name: Verify docs dependency lock is committed
        run: git diff --exit-code -- docs/requirements/lock/base.txt

      - name: Install docs dependencies
        uses: validityBase/vbase-github-actions/.github/actions/setup-python-deps@v1
        with:
          requirements-files: |
            docs/requirements/lock/base.txt
          python-version: "3.11"
          require-hashes: "true"
